name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [created]
  workflow_call:
    outputs:
      keras-sha:
        value: ${{ jobs.run_cpu_tests.outputs.keras-sha }}
      failed-tests:
        value: ${{ jobs.run_cpu_tests.outputs.failed-tests }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  run_cpu_tests:
    strategy:
      fail-fast: false

    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      keras-sha: ${{ steps.keras.outputs.sha }}
      failed-tests: ${{ steps.summary.outputs.failed }}

    env:
      KERAS_HOME: ../keras-openvino/.github/workflows/config

    steps:
      - name: Checkout keras-openvino ${{ github.ref }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: keras-openvino
          persist-credentials: false
 
      - name: Checkout keras
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: keras-team/keras
          ref: master
          path: keras
          persist-credentials: false

      - name: Record keras commit
        id: keras
        run: echo "sha=$(git -C keras rev-parse HEAD)" >> "$GITHUB_OUTPUT"
 
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r keras/requirements.txt
          pip install -r keras-openvino/requirements.txt

      - name: Install keras-openvino
        working-directory: ./keras-openvino
        run: pip install -e .

      - name: Verify installation
        working-directory: ./keras
        run: python -c "import keras; assert keras.backend.backend() == 'openvino'; import keras_openvino; print(keras_openvino.__version__)"

      - name: Run Tests
        working-directory: ./keras
        run: |
          set -o pipefail
          pytest keras -n auto --dist loadfile --ignore keras/src/applications --ignore keras/src/wrappers | tee "$RUNNER_TEMP/pytest.log"

      - name: Collect failed tests
        id: summary
        if: always()
        run: |
          failed=$(grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/pytest.log" 2>/dev/null | sed -E 's/ - .*$//' || true)
          count=$(printf '%s' "$failed" | grep -c . || true)
          {
            echo "failed<<EOF_FAILED"
            printf '%s\n' "$failed" | head -n 30
            if [ "$count" -gt 30 ]; then echo "... and $((count - 30)) more"; fi
            echo "EOF_FAILED"
          } >> "$GITHUB_OUTPUT"

      # TODO integration tests

  format:
    name: Check the code format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Get pip cache dir
        id: pip-cache
        run: |
          python -m pip install --upgrade pip setuptools
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: pip cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt --upgrade

      - name: Run pre-commit
        run: pre-commit run --all-files --hook-stage manual

  publish-pypi:
    name: Build and stage package to OSS Exit Gate (PyPI)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build distribution packages
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Clean up stale releases from staging repo
        run: |
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="keras-openvino--pypi" \
              --format="value(name)" 2>/dev/null)
          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="oss-exit-gate-prod" \
                  --location="us" \
                  --repository="keras-openvino--pypi" \
                  --quiet
          '
      - name: Stage distributions to OSS Exit Gate and upload manifest
        run: |
          python -m pip install --upgrade twine
          python -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/keras-openvino--pypi/" \
            -u oauth2accesstoken \
            -p "$(gcloud auth print-access-token)" \
            dist/*
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/keras-openvino/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
