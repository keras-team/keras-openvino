name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'keras-team/keras-openvino'
    uses: ./.github/workflows/actions.yml # zizmor: ignore[self-repository]

  report:
    name: Report failure
    needs: [tests]
    if: >-
      !cancelled() &&
      github.repository == 'keras-team/keras-openvino' &&
      needs.tests.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.tests.result }}
          KERAS_SHA: ${{ needs.tests.outputs.keras-sha }}
          KERAS_HUB_SHA: ${{ needs.tests.outputs.keras-hub-sha }}
          KERAS_FAILED_TESTS: ${{ needs.tests.outputs.failed-tests }}
          KERAS_HUB_FAILED_TESTS: ${{ needs.tests.outputs.keras-hub-failed-tests }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FAILED_TESTS=$(printf '%s\n%s\n' "$KERAS_FAILED_TESTS" "$KERAS_HUB_FAILED_TESTS" | sed '/^$/d')
          if [ "$RESULT" = "cancelled" ]; then
            status="timed out or was cancelled"
          else
            status="failed"
          fi
          if [ -n "$KERAS_SHA" ]; then
            keras="https://github.com/keras-team/keras/commit/$KERAS_SHA"
          else
            keras="unknown"
          fi
          if [ -n "$KERAS_HUB_SHA" ]; then
            keras_hub="https://github.com/keras-team/keras-hub/commit/$KERAS_HUB_SHA"
          else
            keras_hub="unknown"
          fi
          {
            echo "Run: $RUN_URL"
            echo "Keras commit: $keras"
            echo "keras-hub commit: $keras_hub"
            echo
            if [ -n "$FAILED_TESTS" ]; then
              echo "Failing tests:"
              echo '```'
              echo "$FAILED_TESTS"
              echo '```'
            else
              echo "No test summary: the run failed before the tests ran, or timed out. See the run log."
            fi
          } > details.md

          gh label create ci-nightly --color B60205 \
            --description "Nightly CI is failing" --force
          issue=$(gh issue list --label ci-nightly --state open \
            --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            last=$(gh issue view "$issue" --json body,comments --jq \
              '[.body] + [.comments[] | select(.author.login == "github-actions") | .body] | last')
            previous=$(printf '%s\n' "$last" | sed -n '/^```$/,/^```$/p' | sed '1d;$d')
            if [ -n "$FAILED_TESTS" ] && [ "$previous" = "$(printf '%s\n' "$FAILED_TESTS")" ]; then
              echo "Same failing tests as the last report, not commenting."
              exit 0
            fi
            { echo "The nightly run $status again."; echo; cat details.md; } > comment.md
            gh issue comment "$issue" --body-file comment.md
          else
            {
              echo "The nightly run against Keras master and keras-hub master $status."
              echo
              cat details.md
              echo
              echo "Reference this issue with \`Fixes #<number>\` in the PR that fixes it."
            } > issue.md
            gh issue create --label ci-nightly \
              --title "Nightly CI is failing" \
              --body-file issue.md
          fi

  check_commits:
    name: Check recent commits
    if: >-
      github.repository == 'keras-team/keras-openvino' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      has_recent_commits: ${{ steps.check.outputs.has_recent_commits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          # Check for commits in the last 25 hours (1 hour margin).
          if [ -z "$(git rev-list --after="25 hours" "$TARGET_SHA")" ]; then
            echo "has_recent_commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_recent_commits=true" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    name: Build and publish nightly to PyPI
    needs: [check_commits, tests]
    if: >-
      github.repository == 'keras-team/keras-openvino' &&
      github.ref == 'refs/heads/main' &&
      needs.tests.result == 'success' &&
      needs.check_commits.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.check_commits.outputs.has_recent_commits == 'true')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install build twine
      - name: Build wheel and sdist
        run: |
          python pip_build.py --nightly
          twine check dist/*
      - name: Publish Keras OpenVINO Nightly to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true
